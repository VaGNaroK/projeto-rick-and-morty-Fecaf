<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty - Explorador de Personagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-content">
      <h1>Rick and Morty<span>API</span></h1>
      <p>Catálogo de personagens em tempo real</p>
      
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Buscar personagem (ex: Rick, Morty)">
        <select id="status-filter">
          <option value="">Todos os estado</option>
          <option value="alive">Vivo</option>
          <option value="dead">Morto</option>
          <option value="unknown">Desconhecido</option>
        </select>
        <button id="search-btn">Filtrar</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Status de carregamento / mensagens -->
    <p id="status-message" class="status-message">Carregando dados da dimensão C-137...</p>

    <!-- Container Obrigatório: Vazio no HTML, preenchido via createElement e appendChild -->
    <section id="cards-container" class="cards-grid"></section>
  </main>

  <footer class="footer">
    <p>Projeto Front-End UniFECAF &bull; Informações requisitadas <a href="https://rickandmortyapi.com/" target="_blank">The Rick and Morty API</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
